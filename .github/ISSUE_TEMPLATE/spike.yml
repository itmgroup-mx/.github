name: Spike
description: Time-boxed investigation to reduce uncertainty
type: Spike

body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
      description: Clearly state the question or uncertainty this investigation should resolve.
      placeholder: What do we need to learn or decide?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain why this investigation is needed.
    validations:
      required: true

  - type: textarea
    id: expected_outcome
    attributes:
      label: Expected outcome
      description: Describe the expected result of the investigation.
      placeholder: Decision, recommendation, prototype, technical approach, estimate, etc.
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add references, constraints, links or other useful information.
    validations:
      required: false
